<ion-header>
  <ion-toolbar color="primary">
    <ion-title>DAM CRM</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="login-card">
    <ion-card-header>
      <ion-card-title>Iniciar sesión</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <ion-item>
          <ion-input label="Email" labelPlacement="stacked" type="email" formControlName="email"
            autocomplete="email" errorText="Email no válido"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Contraseña" labelPlacement="stacked" type="password" formControlName="password"
            autocomplete="current-password" errorText="La contraseña es obligatoria">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>

        @if (errorMessage()) {
          <ion-text color="danger"><p class="ion-padding-top">{{ errorMessage() }}</p></ion-text>
        }

        <ion-button class="ion-margin-top" type="submit" expand="block" [disabled]="loginForm.invalid || loading()">
          @if (loading()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Entrar
          }
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
